<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Your Bag — VÉNARO</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="cart-page">


    <!-- HEADER -->

    <header class="header">

        <a href="index.html" class="logo">
            VÉNARO
        </a>


        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="./collections.html">
                Collections
            </a>

            <a href="./about.html">
                About
            </a>

            <a href="./contact.html">
                Contact
            </a>

        </nav>


        <div class="header-actions">

            <a href="shop.html" class="cart-btn">
                Continue Shopping
            </a>

        </div>

    </header>



    <!-- CART -->

    <main class="cart-container">

        <div class="cart-title">

            <p>
                VÉNARO / YOUR BAG
            </p>

            <h1>
                YOUR
                <span>BAG.</span>
            </h1>

        </div>


        <div class="cart-layout">


            <!-- PRODUCTS -->

            <section
                class="cart-items"
                id="cartItems">

            </section>


            <!-- SUMMARY -->

            <aside class="cart-summary">

                <p class="summary-label">
                    ORDER SUMMARY
                </p>

                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span id="subtotal">
                        $0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Shipping
                    </span>

                    <span>
                        FREE
                    </span>

                </div>


                <div class="summary-total">

                    <span>
                        TOTAL
                    </span>

                    <span id="total">
                        $0
                    </span>

                </div>


                <button
                    class="checkout-btn"
                    id="checkoutBtn">

                    CHECKOUT

                    <span>→</span>

                </button>

            </aside>

        </div>

    </main>


    <script src="js/cart.js"></script>

</body>

</html>
