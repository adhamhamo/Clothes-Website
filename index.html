<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VÉNARO — Wear Your Identity</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <a href="index.html" class="logo">
        VÉNARO
    </a>

    <nav class="navbar">

        <a href="index.html" class="active">
            Home
        </a>

        <a href="./shop.html">
            Shop
        </a>

        <!-- CHANGED: Collections -->
        <a href="collections.html">
            Collections
        </a>

        <a href="./about.html">
            About
        </a>

        <a href="./contact.html">
            Contact
        </a>

    </nav>

    <div class="header-actions">

        <button class="icon-btn" id="searchBtn">
            ⌕
        </button>

        <button class="icon-btn" id="wishlistBtn">
            ♡
        </button>

        <button class="cart-btn" id="cartBtn">
            Bag <span>0</span>
        </button>

    </div>

</header>


<!-- ================= HERO ================= -->

<main>

    <section class="hero">

        <div class="hero-image">

            <img
                src="images/Hero.png"
                alt="Vénaro Fashion">

        </div>


        <div class="hero-overlay"></div>


        <div class="hero-content">

            

            <h1>

                <span>WEAR</span>

                <span>YOUR</span>

                <span>IDENTITY.</span>

            </h1>


            <p class="hero-description">
                Discover a new expression of modern fashion.
                Designed for those who create their own identity.
            </p>


            <a
                href="./shop.html"
                class="hero-btn">

                <span>
                    SHOP COLLECTION
                </span>

                <span class="arrow">
                    →
                </span>

            </a>

        </div>


        <div class="hero-bottom">

            <div class="scroll-line"></div>

        </div>


        <div class="hero-number">
            01 / 04
        </div>

    </section>


</main>


<script src="js/main.js"></script>

</body>

</html>
