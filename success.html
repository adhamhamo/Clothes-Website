<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Order Confirmed — VÉNARO</title>

<link
    rel="stylesheet"
    href="css/style.css">

</head>

<body class="success-page">

<!-- HEADER -->

<header class="header">

    <a
        href="index.html"
        class="logo">

        VÉNARO

    </a>


    <nav class="navbar">

        <a href="index.html">
            Home
        </a>

        <a href="shop.html">
            Shop
        </a>

        <a href="shop.html">
            Collections
        </a>

        <a href="cart.html">
            Bag
        </a>

    </nav>


    <div class="header-actions">

        <a
            href="shop.html"
            class="cart-btn">

            CONTINUE SHOPPING

        </a>

    </div>

</header>



<!-- SUCCESS -->

<main class="success-container">


    <section class="success-card">


        <div class="success-icon">

            ✓

        </div>


        <p class="success-label">

            VÉNARO / ORDER CONFIRMED

        </p>


        <h1>

            THANK YOU
            <span>FOR YOUR ORDER.</span>

        </h1>


        <p class="success-message">

            Your order has been successfully placed.
            We will contact you soon to confirm your order.

        </p>


        <!-- ORDER NUMBER -->

        <div class="order-number-box">

            <span>
                ORDER NUMBER
            </span>

            <strong id="orderNumber">
                —
            </strong>

        </div>



        <!-- CUSTOMER -->

        <div class="success-details">

            <div>

                <span>
                    CUSTOMER
                </span>

                <strong id="customerName">
                    —
                </strong>

            </div>


            <div>

                <span>
                    CITY
                </span>

                <strong id="customerCity">
                    —
                </strong>

            </div>


            <div>

                <span>
                    TOTAL
                </span>

                <strong id="orderTotal">
                    $0.00
                </strong>

            </div>

        </div>



        <!-- ACTIONS -->

        <div class="success-actions">

            <a
                href="shop.html"
                class="success-shop-btn">

                CONTINUE SHOPPING

                <span>
                    →
                </span>

            </a>


            <a
                href="index.html"
                class="success-home-btn">

                BACK TO HOME

            </a>

        </div>


    </section>

</main>



<script src="js/success.js"></script>

</body>

</html>
